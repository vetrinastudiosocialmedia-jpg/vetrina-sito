# Pubblica il sito su GitHub Pages a ogni modifica del ramo "main".
# Se nel repository viene caricato un file .zip con i file del sito,
# lo estrae, salva i file nel repository e poi pubblica.
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai l'archivio caricato (se presente)
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              unzip -o "$z" -x '.github/*' -d .
              git rm -q "$z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Estrai i file del sito dall'archivio"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
              env:
          NEXT_PUBLIC_PAYPAL_PLAN_ESSENZIALE: ${{ secrets.PAYPAL_PLAN_ESSENZIALE }}
          NEXT_PUBLIC_PAYPAL_PLAN_CRESCITA: ${{ secrets.PAYPAL_PLAN_CRESCITA }}
          NEXT_PUBLIC_PAYPAL_PLAN_PRO: ${{ secrets.PAYPAL_PLAN_PRO }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
